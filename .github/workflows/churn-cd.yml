# =============================================================================
# churn-cd — continuous delivery. One run on merge to `main`, three stages:
#
#   deploy-staging : deploy to staging, train and register a model
#                    (the end-to-end check)
#   promote        : advance the `release` pointer to this commit
#                    (`release` records what production runs; it is not a trigger)
#   deploy-prod    : deploy to production, train and register a new production
#                    model version, which parks for model approval in Unity Catalog
#
# Governance gates:
#   Gate 1 — code review on the pull request (branch protection: churn-ci check
#            + reviewer approval), before the merge that starts this pipeline.
#   Gate 2 — pre-production release: the deploy-prod stage targets a protected
#            GitHub Environment, so promotion to prod pauses for human approval.
#   Gate 3 — model approval in Unity Catalog (the parked version is approved by a
#            data scientist, which promotes it and updates the serving endpoint).
#
# The commit that passes staging is exactly the commit deployed to prod.
# Databricks auth is a service principal (Actions secrets). The promote step
# updates `release` using GITHUB_TOKEN; `release` has no trigger, so it starts
# no further runs.
# =============================================================================
name: churn-cd
on:
  push:
    branches: [ main ]   # `release` intentionally omitted (audit pointer only)

permissions:
  contents: write

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  DATABRICKS_TF_VERSION: "1.5.7"
  # Unity Catalog to deploy into — repository variable, not a secret
  # (Settings -> Secrets and variables -> Actions -> Variables).
  BUNDLE_VAR_catalog: ${{ vars.DATABRICKS_CATALOG }}

jobs:
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: "Staging: deploy + train + register (E2E gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: churn-mlops
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          set -euo pipefail
          # Fail loudly and early: the bundle deploys happily with an unset
          # catalog, producing jobs that only break at run time.
          : "${BUNDLE_VAR_catalog:?Set the repository variable DATABRICKS_CATALOG to your Unity Catalog name}"
          echo "Catalog: $BUNDLE_VAR_catalog"
      - name: Install tooling (Databricks CLI + Terraform 1.5.7)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o /tmp/tf.zip
          unzip -oq /tmp/tf.zip -d /tmp/tfbin
          echo "DATABRICKS_TF_EXEC_PATH=/tmp/tfbin/terraform" >> "$GITHUB_ENV"
      - name: Deploy to staging
        run: |
          set -euo pipefail
          databricks bundle deploy -t staging
      - name: E2E gate — train + register (batch inference best-effort)
        run: |
          set -euo pipefail
          # The promotion gate: training + model registration must succeed in
          # staging (against shared prod data) before anything reaches prod.
          databricks bundle run churn_training -t staging
          databricks bundle run churn_batch_inference -t staging \
            || echo "::warning::staging batch inference failed (non-fatal)"

  # ---------------------------------------------------------------------------
  promote:
    name: "Promote: fast-forward release (audit pointer)"
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Fast-forward release to this commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `release` records what prod runs. Move it to the commit that just
          # passed the staging gate. --ff-only keeps release a clean ancestor line.
          git push origin "HEAD:refs/heads/release"
          echo "release fast-forwarded to ${GITHUB_SHA}"

  # ---------------------------------------------------------------------------
  deploy-prod:
    name: "Prod: deploy + train -> Challenger (parks at Gate 2)"
    needs: promote
    # Promotion gate: this job waits for a human to approve the `prod` GitHub
    # Environment (Settings -> Environments -> prod -> Required reviewers). The
    # cascade runs staging + promote, then PAUSES here until you click
    # "Review deployments -> Approve" in the Actions run. Only then does prod deploy.
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: churn-mlops
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          set -euo pipefail
          : "${BUNDLE_VAR_catalog:?Set the repository variable DATABRICKS_CATALOG to your Unity Catalog name}"
          echo "Catalog: $BUNDLE_VAR_catalog"
      - name: Install tooling (Databricks CLI + Terraform 1.5.7)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o /tmp/tf.zip
          unzip -oq /tmp/tf.zip -d /tmp/tfbin
          echo "DATABRICKS_TF_EXEC_PATH=/tmp/tfbin/terraform" >> "$GITHUB_ENV"
      - name: Deploy to prod + train -> register Challenger
        run: |
          set -euo pipefail
          # Same commit that passed the staging gate (test what you ship).
          databricks bundle deploy -t prod
          databricks bundle run churn_training -t prod
          echo "New prod Challenger registered — parks at the UC approval gate."
          echo "Approve it in the model UI (Gate 2) to promote @Champion and roll the endpoint."
