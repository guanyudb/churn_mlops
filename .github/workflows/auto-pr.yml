# =============================================================================
# Auto-PR — open a PR feature/** -> main automatically on push, so the dev's only
# manual step is to review + Merge (Gate 1). No PR is created if one is open.
#   Databricks Git folder: branch feature/* -> edit -> commit & push -> (this) opens PR.
# Uses the built-in GITHUB_TOKEN (needs `pull-requests: write`).
# =============================================================================
name: auto-pr
on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR feature -> main (skip if one is open)
        env:
          GH_TOKEN: ${{ github.token }}
          BR: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --base main --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then echo "PR already open for $BR -> main; nothing to do."; exit 0; fi
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$BR" --base main \
            --title "Merge $BR into main" \
            --body "Auto-created on push. Review the diff and Merge to satisfy Gate 1 (the churn-ci check must also be green)."
